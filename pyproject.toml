[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ct-slmr"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pillow>=10.0",
  "torch>=2.1",
  "transformers==4.46.3",
  "accelerate>=0.33",
  "tqdm>=4.66"
]

[project.optional-dependencies]
evaluation = [
  "bert-score>=0.3.13",
  "nltk>=3.8",
  "rouge-score>=0.1.2"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ct_slmr*"]
